[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = ["^src/tests/"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[project]
name = "s21_slot_bot"
version = "1.1.3"
requires-python = ">= 3.14"
dependencies = [
    "aiohttp==3.14.3",
    "anyio==4.14.2",
    "cashews==7.5.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "click==8.4.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "mypy-extensions==1.1.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "platformdirs==4.11.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-telegram-bot[job-queue]==22.8",
    "pytokens==0.4.1",
    "requests==2.34.2",
    "typing-extensions==4.16.0",
    "urllib3==2.7.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
]
